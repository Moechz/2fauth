# ===========================================================================
# 2fauth for TerraMaster TOS 7 (Docker application)
# ===========================================================================
# Upstream image : 2fauth/2fauth:9.0.2 (Docker Hub, used unmodified)
#                  multi-arch OCI index:
#                  sha256:6774efa7c612e424eb17a54e2373524d9a04af6cad7e38d85d76fed87f6a48bd
#                  -> https://github.com/Bubka/2FAuth
#
# Ports   : host 8040 -> container 8000. The host port is in the
#           TOS-recommended 8000-19999 range and is not one of the reserved
#           ports (22/80/443/445/3306/5050/5432/6379/8181/8443).
# Volumes : all persistent data lives below
#           /Volume1/DockerAppData/twofauthdocker/. The /Volume* wildcard is
#           deliberately NOT used: the platform does not expand it.
# TOS rules honoured: Docker Hub image with a fixed tag (never ':latest'),
#           container_name == application id, restart: unless-stopped,
#           non-root user, no privileged mode, no network_mode: host, no
#           cap_add, explicit TZ, a healthcheck on the only service, and
#           x-app-meta as the last block.
# Wrapper : the upstream image does not create the framework directories on an
#           empty mounted volume, and its entrypoint keeps the shell as PID 1
#           while supervisord runs as a child. The entrypoint below prepares the
#           volume, initialises Passport quietly, and forwards the stop signal
#           to supervisord so the service stops cleanly.
# Escaping: docker compose interpolates ${VAR}/$VAR in compose files, so any
#           '$' meant for the shell is written '$$'.
#
# NOTE for maintainers: never place a comment line directly in front of a
# "- value" sequence item (ports, volumes, ...). The official
# TOSAppSelfTestingTool parses the compose file line by line; a comment inside
# a sequence makes it skip its permission sync, the mounted directories stay
# root-owned and the non-root container cannot write into them.

services:
  twofauthdocker:
    image: 2fauth/2fauth:9.0.2
    container_name: twofauthdocker
    restart: unless-stopped
    user: "1000:1000"
    stop_grace_period: 20s
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        @@ENTRYPOINT_SH@@
    ports:
      - "8040:8000"
    environment:
      TZ: "Asia/Shanghai"
      # 2FAuth logs login e-mail addresses and client IPs at info/notice level.
      # This package raises the threshold so those values do not persist in
      # storage/logs/laravel.log (review finding F10). The application keeps its
      # own audit trail in the database instead.
      LOG_LEVEL: "warning"
    volumes:
      - /Volume1/DockerAppData/twofauthdocker/storage:/2fauth/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# TOS App Center web metadata (must be the last block of the file):
# web.port is the published host port above, protocol is http.
x-app-meta:
  web:
    port: 8040
    protocol: http
